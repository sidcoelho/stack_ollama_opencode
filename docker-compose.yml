services:

  ollama:
    image: ollama/ollama:0.32.5
    container_name: ollama-opencode
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA_PATH:-$HOME/.local/share/ollama}:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # Para GPU NVIDIA: instale nvidia-container-toolkit e descomente:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.32.5
    container_name: ollama-opencode-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      PRIMARY_MODEL: ${PRIMARY_MODEL}
      SMALL_MODEL: ${SMALL_MODEL}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ollama list | grep -Fq "$$PRIMARY_MODEL" || ollama pull "$$PRIMARY_MODEL"
        ollama list | grep -Fq "$$SMALL_MODEL"   || ollama pull "$$SMALL_MODEL"

  opencode:
    profiles: ["cli"]
      #image: opencode-local:latest
    build:
      context: .
      dockerfile: ./images/dockerfile-opencode
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ${PROJECT_DIR}:/contents
    environment:
      OPENCODE_CONFIG_CONTENT: >-
        {
          "model": "ollama/${PRIMARY_MODEL}",
          "small_model": "ollama/${SMALL_MODEL}",
          "compaction": {
            "auto": false
          },
          "provider": {
            "ollama": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "Ollama Local",
              "options": {
                "baseURL": "http://ollama:11434/v1",
                "apiKey": "ollama"
              },
              "models": {
                "${PRIMARY_MODEL:-qwen2.5-coder:7b}": {
                  "tools": true,
                  "limit": { "context": ${OLLAMA_CONTEXT_LENGTH:-4096}, "output": 2048 }
                },
                "${SMALL_MODEL:-qwen3:4b}": {
                  "tools": true,
                  "limit": { "context": ${OLLAMA_CONTEXT_LENGTH:-4096}, "output": 2048 }
                }
              }
            }
          }
        }
